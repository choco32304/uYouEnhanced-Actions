name: Build uYouEnhanced

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 リポジトリをクローン
      uses: actions/checkout@v4

    - name: 🔧 必要なパッケージをインストール
      run: |
        sudo apt update
        sudo apt install -y make clang llvm dpkg unzip curl git

    - name: 🔧 libtapi-dev をソースからインストール
      run: |
        sudo apt update
        sudo apt install -y build-essential
        git clone https://github.com/apple/swift.git
        cd swift
        # サブモジュールを初期化して更新
        git submodule update --init --recursive
        mkdir build
        cd build
        cmake ..
        make -j
        sudo make install

    - name: 🔨 ldid をビルドしてインストール
      run: |
        git clone https://github.com/ProcursusTeam/ldid.git
        cd ldid
        make
        sudo cp ldid /usr/local/bin

    - name: 📦 uYouPlus をクローン＆ビルド
      run: |
        git clone https://github.com/qnblackcat/uYouPlus.git
        cd uYouPlus
        ./scripts/setup.sh
        ./scripts/build.sh

    - name: 📤 IPAを成果物としてアップロード
      uses: actions/upload
